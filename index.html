<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3122b">
<meta name="robots" content="noindex">
<title>Be a Lifesaver</title>
<style>
:root{--red:#b3122b;--red-d:#86091d;--ink:#1f1a1a;--muted:#6d6464;--bg:#fbf5f2;--card:#fff;--line:#ecdfda;--ok:#1d7a4b;--okbg:#e8f5ee;--no:#a4231b;--nobg:#fdeceb;--warn:#8a5200;--warnbg:#fff3df;--r:18px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Malayalam",sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 10px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--red-d);line-height:1.2}
.drop{width:18px;height:22px;background:var(--red);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;transform:rotate(0);flex:none;position:relative}
.drop:before{content:"";position:absolute;left:50%;top:-6px;width:0;height:0;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid var(--red)}
.lvl{font-size:12px;font-weight:700;background:var(--red);color:#fff;border-radius:99px;padding:4px 10px;white-space:nowrap}
.bar{height:6px;background:#efe3de;border-radius:9px;overflow:hidden;margin:0 2px 14px}
.bar i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .35s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;box-shadow:0 6px 24px rgba(134,9,29,.07)}
h1{font-size:30px;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.25;margin:4px 0 12px}
.lead{font-size:17px;color:#3c3535;margin:0 0 6px}
.eyebrow{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
.fine{font-size:13.5px;color:var(--muted);margin:14px 0 0}
.btn{display:block;width:100%;min-height:52px;padding:14px 18px;border:2px solid var(--red);border-radius:14px;background:var(--red);color:#fff;font:inherit;font-weight:650;font-size:17px;cursor:pointer;margin-top:14px;text-align:center;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--red)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);font-weight:500;font-size:15px;min-height:44px}
.btn.big{font-size:20px;min-height:68px}
.btn[disabled]{opacity:.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .btn{margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.grid .btn{margin:0;min-height:56px;font-size:19px;padding:10px}
.grid .wide{grid-column:1/-1;font-size:16px}
.fb{border-radius:14px;padding:14px 16px;margin-top:6px}
.fb.ok{background:var(--okbg);color:#14583a}
.fb.no{background:var(--nobg);color:#7a1a14}
.pts{font-weight:800;margin-left:4px}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:14.5px;margin:12px 0 0}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:4px 12px;margin-bottom:10px}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.wait{background:var(--warnbg);color:var(--warn)}
label{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
input[type=text],input[type=tel],select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid #d9cbc6;border-radius:12px;background:#fff;color:var(--ink);min-height:50px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #f2a3ae;outline-offset:2px}
.tel{display:flex;gap:8px}
.tel span{display:flex;align-items:center;padding:0 12px;border:1.5px solid #d9cbc6;border-radius:12px;background:#f6efec;font-weight:600}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills label{margin:0;font-weight:600;border:1.5px solid #d9cbc6;border-radius:99px;padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pills input{accent-color:var(--red)}
.consent{display:flex;gap:12px;align-items:flex-start;background:#faf3f0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:18px;font-size:14px;font-weight:400;color:#3c3535}
.consent input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--red)}
.err{color:var(--no);font-size:13.5px;margin:5px 0 0;min-height:0}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.dcard{border-radius:20px;padding:18px 18px 20px;color:#fff;background:linear-gradient(145deg,#b3122b,#5e0615);text-align:center;box-shadow:0 10px 26px rgba(94,6,21,.3)}
.dcard .org{font-size:12.5px;font-weight:600;opacity:.9}
.dcard .inner{background:#fff;color:var(--ink);border-radius:14px;margin-top:12px;padding:16px 12px 16px}
.dcard .lbl{font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--red)}
.dcard .nm{font-size:24px;font-weight:750;line-height:1.2;margin-top:6px;overflow-wrap:anywhere}
.dcard .co{font-size:14px;color:var(--muted)}
.dcard .bg{font-size:64px;font-weight:800;color:var(--red);line-height:1.1;margin-top:8px}
.dcard .bgn{font-size:12px;color:var(--muted);margin-bottom:10px}
.dcard .badge{display:inline-block;background:var(--red-d);color:#fff;font-weight:700;border-radius:99px;padding:6px 16px;font-size:15px}
.dcard .ev{font-size:12px;opacity:.85;margin-top:10px}
.status{font-size:14px;border-radius:10px;padding:9px 12px;margin-top:14px}
.status.pending{background:var(--warnbg);color:var(--warn)}
.status.ok{background:var(--okbg);color:var(--ok)}
.status.err{background:var(--nobg);color:var(--no)}
.status.idle{display:none}
.footer{font-size:12.5px;color:var(--muted);text-align:center;margin:16px 6px 0}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}.btn:active{transform:none}}
/* Leaderboard view */
body.board{background:#14090c;color:#fff}
body.board .wrap{max-width:900px;padding-top:28px}
.bd h1{font-size:clamp(28px,5vw,48px);margin:0}
.bd .sub{color:#d6b8bd;margin:4px 0 22px;font-size:clamp(15px,2.4vw,22px)}
.bd .tot{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:22px}
.bd .tot b{display:block;font-size:clamp(36px,8vw,76px);line-height:1;color:#ff6b81}
.bd .tot span{font-size:clamp(13px,2vw,18px);color:#d6b8bd}
.brow{display:grid;grid-template-columns:minmax(120px,32%) 1fr 56px;gap:12px;align-items:center;margin:10px 0;font-size:clamp(15px,2.6vw,24px)}
.brow .t{height:clamp(18px,3vw,30px);background:#2a161b;border-radius:9px;overflow:hidden}
.brow .t i{display:block;height:100%;background:linear-gradient(90deg,#b3122b,#ff4d67);border-radius:9px;transition:width .6s}
.brow .n{text-align:right;font-weight:800}
.bd .join{margin-top:26px;color:#d6b8bd;font-size:clamp(14px,2.4vw,22px)}
.bd .join b{color:#fff}
.demo{display:inline-block;background:#ffcf5c;color:#3a2a00;font-weight:800;border-radius:6px;padding:2px 8px;font-size:13px;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div><noscript><p class="card">Please turn on JavaScript to use this page.</p></noscript></div>

<script>
(function(){
'use strict';

/* ================= CONFIG: edit these before publishing ================= */
const CONFIG={
  API_URL:"https://script.google.com/macros/s/AKfycbynfs8G6UFZyoFjk49vHTgHCrMcDBMgD4ZxxoIJkzPXsa5XSqdQZkvDwGRyusIfIfXIlg/exec",   // the /exec URL from your Apps Script deployment
  ORG_NAME:"Ahalia Blood Transfusion Services",
  EVENT_NAME:"Organ Donation Pledge by Ahalia",
  CONTACT:"Contact bloodbank@ahalia.in",
  PAGE_URL:"https://vishnukarayil.github.io/ABTS/",                                   // e.g. "https://donate.pathonotes.in/" (blank = use this page's address)
  ORGAN_PLEDGE_URL:"https://sites.google.com/view/ahaliablooddonors/home",                             // optional: official organ pledge page, shown as a separate link
  // Keep this list identical to COLLEGES in Code.gs
  COLLEGES:["Ahalia Ayurveda Medical College","Ahalia College of Nursing","Ahalia Diabetes Hospital","Ahalia Foundation Eye Hospital","Ahalia Public School","Ahalia School of Engineering & Technology","Ahalia School of Optometry & Research Centre","Ahalia School of Paramedical Sciences","Ahalia School of Pharmacy","Ahalia School of Management","Ahalia School of Commerce & Mathematics","Ahalia Woman and Child Hospital","Other"]
};
/* ======================================================================== */

const MYTHS=[
  {t:"Donating blood leaves you weak for days.",a:"myth",why:"Your body replaces the lost fluid within about a day. Most donors carry on normally after a short rest and a snack."},
  {t:"One blood donation can help save up to three lives.",a:"fact",why:"Each unit is separated into parts such as red cells, plasma and platelets, which can help different patients."},
  {t:"When stocks run low, hospitals can make blood in a lab.",a:"myth",why:"There is no substitute for human blood. It only comes from donors, and it has to be replaced all the time."}
];
const GROUPS=["A+","A-","B+","B-","AB+","AB-","O+","O-"];
const ELIG=[
  {id:"age",q:"Are you 18 or older?",bad:"no"},
  {id:"weight",q:"Do you weigh 50 kg or more?",bad:"no"},
  {id:"well",q:"Are you healthy today, with no fever, cold or infection, and not on any medication?",bad:"no"},
  {id:"recent",q:"Have you donated blood in the last 3 months?",bad:"yes"},
  {id:"procedure",q:"In the last 1 year, have you got a tattoo, piercing, accident or surgery?",bad:"yes"}
];
const PROGRESS={hook:4,myth:22,type:42,elig:62,outcome:78,register:90,result:100,anon:100};

const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
const SRC=tagOf(params.get('src'),/^[A-Za-z0-9_-]{1,20}$/);
const REF=tagOf((params.get('ref')||'').toUpperCase(),/^[A-HJ-NP-Z2-9]{6}$/);
const IS_DEMO=/PASTE_/.test(CONFIG.API_URL);
if(/REPLACE/.test(CONFIG.CONTACT)&&window.console)console.warn('Set CONFIG.CONTACT before publishing.');

function tagOf(v,re){v=(v||'').trim();return re.test(v)?v:''}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pageUrl(){return CONFIG.PAGE_URL||(location.origin+location.pathname)}
function genCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=new Uint8Array(6),s='';(window.crypto||window.msCrypto).getRandomValues(r);for(var i=0;i<6;i++)s+=a[r[i]%a.length];return s}

function fresh(){return{screen:'hook',q:0,points:0,answered:null,mythDone:false,bloodGroup:'',eIdx:0,eAns:{},outcome:'',reg:null,anonCollege:'',anonDone:false,sync:'idle',syncMsg:'',errs:{}}}
let S=fresh();

/* ---------- levels ---------- */
function level(){
  if(S.outcome==='future_anon')return 'Future Hero';
  if(S.reg)return 'Lifesaver';
  if(S.mythDone)return 'Rookie';
  return '';
}

/* ---------- views ---------- */
const VIEWS={
hook:function(){return '<h1>Ready to be a Lifesaver?</h1><p class="lead">Three quick myth-or-fact cards, then join the blood donor register. It takes under 3 minutes.</p><button class="btn big" data-a="start">Let\u2019s go</button><p class="fine">This is a <b>blood donor</b> register. It is separate from an organ pledge.</p>'},

myth:function(){
  var m=MYTHS[S.q],h='<p class="eyebrow">Card '+(S.q+1)+' of '+MYTHS.length+' \u00b7 '+S.points+' pts</p><h2>'+esc(m.t)+'</h2>';
  if(S.answered===null){
    h+='<div class="row2"><button class="btn ghost big" data-a="ans" data-v="myth">Myth</button><button class="btn ghost big" data-a="ans" data-v="fact">Fact</button></div>';
  }else{
    var ok=S.answered===m.a;
    h+='<div class="fb '+(ok?'ok':'no')+'" role="status"><b>'+(ok?'Correct!':'Not quite.')+'</b> It\u2019s a '+m.a+'. '+esc(m.why)+(ok?' <span class="pts">+10</span>':'')+'</div>';
    h+='<button class="btn" data-a="next">'+(S.q<MYTHS.length-1?'Next card':'Finish quiz')+'</button>';
  }
  return h;
},

type:function(){
  var h='<p class="eyebrow">Quiz complete \u00b7 '+S.points+' points</p><h2>Rookie unlocked. Do you know your blood group?</h2><div class="grid">';
  GROUPS.forEach(function(g){h+='<button class="btn ghost" data-a="group" data-v="'+g+'">'+g+'</button>'});
  h+='<button class="btn ghost wide" data-a="group" data-v="unknown">I don\u2019t know yet</button></div>';
  h+='<p class="fine">Not sure? Pick \u201cI don\u2019t know yet\u201d and get a free blood group check at our stall. Your group is confirmed at your first donation.</p>';
  return h;
},

elig:function(){
  var e=ELIG[S.eIdx],h='';
  if(S.eIdx===0)h+='<h2>Can you donate today?</h2><p class="fine" style="margin-top:0">No points for these answers. Honest answers keep donors and patients safe.</p>';
  h+='<p class="eyebrow" style="margin-top:14px">Question '+(S.eIdx+1)+' of '+ELIG.length+'</p><p class="lead"><b>'+esc(e.q)+'</b></p>';
  h+='<div class="row2"><button class="btn ghost big" data-a="eans" data-v="yes">Yes</button><button class="btn ghost big" data-a="eans" data-v="no">No</button></div>';
  return h;
},

outcome:function(){
  var o=S.outcome,h='';
  if(o==='eligible'){
    h+='<span class="tag ok">Looks good</span><h2>You may be able to donate today.</h2><p class="lead">Our medical officer makes the final decision at the time of donation. Join the register so we can reach you for camps and urgent needs.</p><button class="btn" data-a="toreg">Join the register</button>';
  }else if(o==='reserve'){
    h+='<span class="tag wait">Reserve Donor</span><h2>Not today, but maybe soon.</h2><p class="lead">Based on your answers you should wait before donating. Join the reserve list and we\u2019ll contact you for a later camp.</p><button class="btn" data-a="toreg">Join the reserve list</button>';
  }else if(o==='future'){
    h+='<span class="tag wait">Future Hero</span><h2>Not yet, and that\u2019s fine.</h2><p class="lead">You\u2019re below the minimum weight for now. Join the list and we\u2019ll keep in touch for when you can donate.</p><button class="btn" data-a="toreg">Join the list</button>';
  }else{
    h+='<span class="tag wait">Future Hero</span><h2>You can donate from 18.</h2><p class="lead">Until then, you can still help by spreading the word. We don\u2019t collect names or numbers from anyone under 18 on this page.</p>';
    h+='<label for="anonCollege">Count me in for my institute (optional)</label><select id="anonCollege"><option value="">Choose your institute</option>'+CONFIG.COLLEGES.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</select>';
    h+='<p class="fine" style="margin-top:8px">This only adds one to your institute\u2019s Future Hero count. No name or number is stored.</p><div class="err" id="e-anon"></div>';
    h+='<button class="btn" data-a="anonjoin">Count me in</button><button class="btn quiet" data-a="anonskip">Skip</button>';
  }
  return h;
},

register:function(){
  var h='<h2>Join the register</h2><form id="f" novalidate autocomplete="on">';
  h+='<label for="name">Full name</label><input type="text" id="name" name="name" autocomplete="name" maxlength="60"><div class="err" id="e-name"></div>';
  h+='<label for="mobile">Mobile number</label><div class="tel"><span>+91</span><input type="tel" id="mobile" name="mobile" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="10-digit number"></div><div class="err" id="e-mobile"></div>';
  h+='<label for="college">Institute</label><select id="college" name="college"><option value="">Choose your institute</option>'+CONFIG.COLLEGES.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</select><div class="err" id="e-college"></div>';
  h+='<label>Best way to reach you</label><div class="pills"><label><input type="radio" name="contact" value="WhatsApp" checked>WhatsApp</label><label><input type="radio" name="contact" value="Call">Call</label><label><input type="radio" name="contact" value="SMS">SMS</label></div>';
  h+='<div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>';
  h+='<label class="consent" for="consent"><input type="checkbox" id="consent"><span>I agree that '+esc(CONFIG.ORG_NAME)+' may contact me on this number about blood donation camps and urgent blood needs. My details are used only for this purpose and kept securely. I can ask for them to be deleted at any time: '+esc(CONFIG.CONTACT)+'.</span></label><div class="err" id="e-consent"></div>';
  h+='<button class="btn" type="submit">Join the register</button></form>';
  return h;
},

result:function(){
  var r=S.reg,o=S.outcome,h='';
  h+=cardHtml();
  h+='<div class="status '+S.sync+'" id="sync" role="status">'+esc(S.syncMsg)+'</div>';
  var next=o==='eligible'?'Next step: collect your coupon at the stall. We\u2019ll message you about the first donation camp.':'You\u2019re on our list. We\u2019ll message you when you can donate.';
  h+='<p class="lead" style="margin-top:16px">'+esc(next)+'</p>';
  h+='<button class="btn" data-a="save">Save my card as an image</button><button class="btn ghost" data-a="share">Share my link with friends</button>';
  if(CONFIG.ORGAN_PLEDGE_URL)h+='<p class="fine">Interested in pledging organs? That is a separate register: <a href="'+esc(CONFIG.ORGAN_PLEDGE_URL)+'" target="_blank" rel="noopener">organ pledge</a>.</p>';
  h+='<button class="btn quiet" data-a="reset">Register another person</button>';
  return h;
},

anon:function(){
  var h='<h2>Thank you, Future Hero!</h2>'+cardHtml();
  if(S.sync!=='idle')h+='<div class="status '+S.sync+'" id="sync" role="status">'+esc(S.syncMsg)+'</div>';
  h+='<p class="lead" style="margin-top:16px">See you at 18. Until then, tell friends who are old enough.</p><button class="btn" data-a="save">Save my card as an image</button><button class="btn ghost" data-a="share">Share this page</button><button class="btn quiet" data-a="reset">Start again</button>';
  return h;
}
};

function cardHtml(){
  var r=S.reg,anon=!r,name=anon?'Future Hero':r.name,college=anon?S.anonCollege:r.college,bg=anon?'':r.bloodGroup;
  return '<div class="dcard"><div class="org">'+esc(CONFIG.ORG_NAME)+'</div><div class="inner"><div class="lbl">DONOR CARD</div><div class="nm">'+esc(name)+'</div><div class="co">'+esc(college||'')+'</div>'+
    '<div class="bg">'+(bg?esc(bg):'\u2014')+'</div><div class="bgn">'+(anon?'':(bg?'self-reported, confirmed at first donation':'blood group to be confirmed'))+'</div>'+
    '<span class="badge">'+esc(level())+'</span></div><div class="ev">'+esc(cap(CONFIG.EVENT_NAME))+'</div></div>';
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

function header(){
  var l=level();
  return '<div class="top"><div class="brand"><span class="drop" aria-hidden="true"></span><span>'+esc(CONFIG.ORG_NAME)+'</span></div>'+(l?'<span class="lvl">'+esc(l)+'</span>':'')+'</div><div class="bar" aria-hidden="true"><i style="width:'+PROGRESS[S.screen]+'%"></i></div>';
}
function footer(){return '<p class="footer">Questions or data deletion: '+esc(CONFIG.CONTACT)+'</p>'}

function render(){
  app.innerHTML=header()+'<main class="card fade">'+VIEWS[S.screen]()+'</main>'+footer();
  window.scrollTo(0,0);
}
function setSync(kind,msg){
  S.sync=kind;S.syncMsg=msg;
  var el=document.getElementById('sync');
  if(el){el.className='status '+kind;el.textContent=msg}
  else if(S.screen==='anon'||S.screen==='result')render();
}

/* ---------- actions ---------- */
const ACTIONS={
start:function(){S.screen='myth';render()},
ans:function(d){
  if(S.answered!==null)return;
  S.answered=d.v;
  if(d.v===MYTHS[S.q].a)S.points+=10;
  render();
},
next:function(){
  S.answered=null;
  if(S.q<MYTHS.length-1){S.q++}else{S.points+=10;S.mythDone=true;S.screen='type'}
  render();
},
group:function(d){S.bloodGroup=d.v==='unknown'?'':d.v;S.screen='elig';S.eIdx=0;S.eAns={};render()},
eans:function(d){
  var e=ELIG[S.eIdx];S.eAns[e.id]=d.v;
  if(e.id==='age'&&d.v==='no'){S.outcome='future_anon';S.screen='outcome';render();return}
  if(S.eIdx<ELIG.length-1){S.eIdx++;render();return}
  var a=S.eAns,bad=ELIG.filter(function(q){return a[q.id]===q.bad}).map(function(q){return q.id});
  S.outcome=bad.indexOf('weight')>=0?'future':(bad.length?'reserve':'eligible');
  S.screen='outcome';render();
},
toreg:function(){S.screen='register';render()},
submit:function(){submitForm()},
anonjoin:function(){
  var c=document.getElementById('anonCollege').value;
  if(!c){document.getElementById('e-anon').textContent='Please choose your institute, or tap Skip.';return}
  S.anonCollege=c;S.screen='anon';S.sync='pending';S.syncMsg='Saving\u2026';render();
  enqueue({anon:true,college:c,src:SRC,qid:genCode()});
},
anonskip:function(){S.anonCollege='';S.screen='anon';render()},
save:async function(){
  try{
    var blob=await cardBlob(),file=new File([blob],'lifesaver-card.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'My donor card'});return}
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lifesaver-card.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  }catch(e){if(e&&e.name!=='AbortError')alert('Could not save the card. Please take a screenshot instead.')}
},
share:async function(){
  var url=S.reg?pageUrl()+'?src=ref&ref='+encodeURIComponent(S.reg.id):pageUrl()+'?src=ref';
  var text='I just joined the blood donor register at '+CONFIG.EVENT_NAME+'. Join me and help your institute win:';
  try{
    if(navigator.share){await navigator.share({title:'Be a Lifesaver',text:text,url:url});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  window.open('https://wa.me/?text='+encodeURIComponent(text+url),'_blank','noopener');
},
reset:function(){S=fresh();render()}
};

app.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a]');if(!b)return;
  var fn=ACTIONS[b.dataset.a];if(!fn)return;
  fn(b.dataset);
});
app.addEventListener('submit',function(ev){ev.preventDefault();if(S.screen==='register')submitForm()});

/* ---------- registration ---------- */
function submitForm(){
  var f=document.getElementById('f');if(!f)return;
  var val=function(id){return document.getElementById(id).value};
  var name=val('name').replace(/\s+/g,' ').trim(),mobile=val('mobile').replace(/\D/g,''),college=val('college'),
      contact=(f.querySelector('input[name=contact]:checked')||{}).value||'WhatsApp',consent=document.getElementById('consent').checked,hp=val('website');
  var ok=true;
  function err(id,m){document.getElementById('e-'+id).textContent=m;if(m)ok=false}
  err('name',name.length<2?'Please enter your name.':'');
  err('mobile',/^[6-9]\d{9}$/.test(mobile)?'':'Enter a valid 10-digit mobile number.');
  err('college',college?'':'Please choose your institute.');
  err('consent',consent?'':'Please tick the box to join.');
  if(!ok)return;
  var reg={id:genCode(),name:name,mobile:mobile,college:college,contact:contact,bloodGroup:S.bloodGroup,outcome:S.outcome,quiz:S.points,src:SRC,ref:REF,consent:true,hp:hp,referrals:0};
  S.reg=reg;S.screen='result';S.sync='pending';S.syncMsg='Saving your registration\u2026';
  render();
  enqueue(reg);
}

/* ---------- saving to the Sheet (queue with retry) ---------- */
var KEY='bd_pending_v1',queue=[],flushing=false,retries=0;
function loadQ(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function saveQ(){try{localStorage.setItem(KEY,JSON.stringify(queue))}catch(e){}}
function enqueue(p){queue.push(p);saveQ();flush()}
async function post(p){
  var c=new AbortController(),t=setTimeout(function(){c.abort()},20000),j;
  try{
    var r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),signal:c.signal,redirect:'follow'});
    j=await r.json();
  }catch(e){throw new Error('network')}finally{clearTimeout(t)}
  if(j&&j.ok)return j;
  var er=new Error((j&&j.error)||'Server error');er.permanent=!(j&&j.retry);throw er;
}
async function flush(){
  if(flushing||!queue.length)return;
  flushing=true;
  while(queue.length){
    var p=queue[0];
    if(IS_DEMO){queue.shift();saveQ();done(p,{ok:true,demo:true});continue}
    try{var j=await post(p);queue.shift();saveQ();done(p,j)}
    catch(e){
      if(e.permanent){queue.shift();saveQ();failed(p,e.message);continue}
      retries++;
      if(isCurrent(p))setSync('pending','Waiting for a connection. Your card is ready and your details will be saved automatically.');
      flushing=false;
      if(retries<40)setTimeout(flush,8000);
      return;
    }
  }
  flushing=false;
}
function isCurrent(p){return p.anon?(S.screen==='anon'):(S.reg&&S.reg.id===p.id)}
function done(p,j){
  if(!isCurrent(p))return;
  if(j.demo){setSync('pending','Demo mode: nothing was saved. Set API_URL in the page to go live.');return}
  if(!p.anon&&j.code&&j.code!==S.reg.id){S.reg.id=j.code;S.sync='ok';S.syncMsg='You were already on the register. Welcome back!';render();return}
  setSync('ok',p.anon?'Counted for your institute. Thank you!':'Registered. Your details are saved.');
}
function failed(p,msg){if(isCurrent(p))setSync('err','Could not save: '+msg+' Please tell a volunteer.')}
queue=loadQ();if(queue.length&&!/[?&]view=board/.test(location.search))flush();

/* ---------- donor card image ---------- */
var FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Malayalam",sans-serif';
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function dropShape(g,x,y,s){g.beginPath();g.moveTo(x,y-s);g.bezierCurveTo(x+s*.2,y-s*.55,x+s*.7,y-s*.1,x+s*.7,y+s*.3);g.arc(x,y+s*.3,s*.7,0,Math.PI,false);g.bezierCurveTo(x-s*.7,y-s*.1,x-s*.2,y-s*.55,x,y-s);g.closePath();g.fill()}
function fit(g,text,max,start,weight){var s=start;do{g.font=weight+' '+s+'px '+FONT;s-=2}while(g.measureText(text).width>max&&s>28)}
function cardBlob(){
  var r=S.reg,anon=!r,name=anon?'Future Hero':r.name,college=anon?S.anonCollege:r.college,bg=anon?'':r.bloodGroup,lvl=level();
  var W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');
  var grd=g.createLinearGradient(0,0,W,H);grd.addColorStop(0,'#b3122b');grd.addColorStop(1,'#5e0615');g.fillStyle=grd;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';dropShape(g,120,140,46);
  g.textAlign='left';g.textBaseline='alphabetic';fit(g,CONFIG.ORG_NAME,W-300,44,'700');g.fillText(CONFIG.ORG_NAME,190,158);
  g.fillStyle='#fff';rr(g,70,230,W-140,H-440,40);g.fill();
  g.textAlign='center';g.fillStyle='#b3122b';g.font='800 36px '+FONT;
  if(g.letterSpacing!==undefined)g.letterSpacing='8px';g.fillText('DONOR CARD',W/2,320);if(g.letterSpacing!==undefined)g.letterSpacing='0px';
  g.fillStyle='#1f1a1a';fit(g,name,W-260,92,'750');g.fillText(name,W/2,450);
  g.fillStyle='#6d6464';fit(g,college||'',W-260,44,'500');g.fillText(college||'',W/2,520);
  g.fillStyle='#ecdfda';g.fillRect(150,580,W-300,3);
  g.fillStyle='#b3122b';g.font='800 270px '+FONT;g.fillText(bg||'\u2014',W/2,830);
  g.fillStyle='#6d6464';g.font='500 34px '+FONT;
  g.fillText(anon?'':(bg?'self-reported, confirmed at first donation':'blood group to be confirmed'),W/2,895);
  g.font='700 50px '+FONT;var tw=g.measureText(lvl).width+90;
  g.fillStyle='#86091d';rr(g,(W-tw)/2,960,tw,92,46);g.fill();
  g.fillStyle='#fff';g.fillText(lvl,W/2,1023);
  g.fillStyle='rgba(255,255,255,.92)';fit(g,cap(CONFIG.EVENT_NAME),W-160,36,'500');g.fillText(cap(CONFIG.EVENT_NAME),W/2,H-110);
  g.font='500 30px '+FONT;g.fillText(new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),W/2,H-60);
  return new Promise(function(res){c.toBlob(res,'image/png')});
}

/* ---------- live college leaderboard: open this page with ?view=board ---------- */
function boardView(){
  document.body.classList.add('board');
  document.title='Institute leaderboard';
  var demo=IS_DEMO;
  async function load(){
    var data;
    if(demo){data={colleges:{},total:0,futureHeroes:0};var t=0;CONFIG.COLLEGES.forEach(function(c,i){var n=Math.max(0,28-i*3);data.colleges[c]=n;t+=n});data.total=t;data.futureHeroes=7}
    else{try{var r=await fetch(CONFIG.API_URL+'?action=stats');data=await r.json()}catch(e){return}}
    if(!data||!data.ok&&!demo)return;
    var rows=Object.keys(data.colleges).map(function(k){return[k,data.colleges[k]]}).sort(function(a,b){return b[1]-a[1]});
    var max=Math.max.apply(null,rows.map(function(r){return r[1]}).concat([1]));
    app.innerHTML='<div class="bd"><h1>Which institute saves the most lives?'+(demo?'<span class="demo">DEMO DATA</span>':'')+'</h1><p class="sub">'+esc(CONFIG.ORG_NAME)+' \u00b7 blood donor register</p>'+
      '<div class="tot"><div><b>'+data.total+'</b><span>donors registered</span></div><div><b>'+(data.futureHeroes||0)+'</b><span>Future Heroes</span></div></div>'+
      rows.map(function(r){return '<div class="brow"><span>'+esc(r[0])+'</span><div class="t"><i style="width:'+Math.round(r[1]/max*100)+'%"></i></div><span class="n">'+r[1]+'</span></div>'}).join('')+
      '<p class="join">Scan the code or tap the tag at our stall, or open <b>'+esc(pageUrl().replace(/^https?:\/\//,''))+'</b></p></div>';
  }
  load();setInterval(load,20000);
}

if(params.get('view')==='board')boardView();else render();
})();
